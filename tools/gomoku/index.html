<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>五子棋</title>
<!--
  五子棋 —— 按「单 HTML 工具编写标准」（tool-authoring 技能）交付的实例。

  它同时是那份标准的一份**可执行样本**：tests/gomoku.mjs 里有一段会逐条
  核对它是否守约（自包含 / 无外部引用 / data-* 齐备 / 响应宿主深浅色 /
  破坏性操作二次确认）。标准写在文档里会漂，钉在测试上才不会。

  四个照抄即用的事：
    1. 与宿主只有 postMessage 一条通道（见下面的 call()），拿不到 SQL；
    2. 战绩写自己的私有表：表名给裸名 "records"，宿主拼成 tool_gomoku_records；
    3. 主题不写死 —— 收到 tool:context 才把 ctx.theme 落到 <html data-theme>，
       所以先渲染、后套色，不假设 context 一定先到；
    4. 关键状态全挂在 data-* 上（state / turn / mode / moves / records / last），
       自动化靠这些断言 —— 没有它，这个工具就没法被回归测试覆盖。

  为什么有「两人对战」这个模式：人机模式下电脑是会防守的，自动化永远下不出
  五连，于是"胜负判定"和"赢了要落库"这两条最核心的逻辑反而验不到。加一个
  双人模式，测试就能自己把黑棋连成五子，把那条链路整条走完。它不是为测试
  而生的摆设 —— 一台电脑上两个人轮流下，本来就该能玩。
-->
<style>
  :root {
    --bg: #ffffff; --fg: #2c2c2a; --fg2: #5f5e5b; --dim: #918f89;
    --line: #e6e4dd; --chip: #f2f0ea; --accent: #378add; --danger: #a32d2d;
    --board: #e9d9b6; --grid: #9b8a63; --win: #d4537e;
  }
  html[data-theme="dark"] {
    --bg: #1c1c1a; --fg: #e8e6e0; --fg2: #b3b0a8; --dim: #8a8780;
    --line: #35342f; --chip: #2a2925; --accent: #5b9de8; --danger: #e07272;
    --board: #35312a; --grid: #6d6553; --win: #e8749b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { display: flex; gap: 18px; height: 100%; padding: 16px 18px; align-items: flex-start; }
  .board-side { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
  .head h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .head .sub { color: var(--dim); font-size: 11.5px; }

  /* 棋盘：15×15 的格子按钮，格线用背景十字铺出来，棋子浮在线上 */
  .board {
    width: min(100%, calc(100vh - 116px));
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(15, 1fr);
    padding: 7px; border-radius: 11px;
    background-color: var(--board);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .08);
  }
  .cell {
    position: relative; padding: 0; border: 0; cursor: pointer;
    background-color: transparent; background-repeat: no-repeat;
    background-image: linear-gradient(var(--grid) 0 0), linear-gradient(var(--grid) 0 0);
    background-size: 100% 1px, 1px 100%;
    background-position: 50% 50%, 50% 50%;
  }
  .cell .st {
    position: absolute; inset: 7%; border-radius: 50%;
    opacity: 0; transform: scale(.65); transition: opacity .12s, transform .12s;
  }
  .cell[data-stone="black"] .st {
    opacity: 1; transform: scale(1);
    background: radial-gradient(circle at 34% 30%, #6e6e68, #191917 72%);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .38);
  }
  .cell[data-stone="white"] .st {
    opacity: 1; transform: scale(1);
    background: radial-gradient(circle at 34% 30%, #ffffff, #d6d1c6 74%);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
  .cell.win .st { outline: 2px solid var(--win); outline-offset: 1px; }
  /* 预落子提示：只在轮到点击、且这一格还空着的时候出现 */
  body[data-state="playing"]:not([data-turn="ai"]) .cell:not([data-stone]):hover .st {
    opacity: .3; transform: scale(1); background: #2c2c2a;
  }
  body[data-turn="ai"] .cell, body[data-turn="-"] .cell { cursor: default; }

  .side { flex: 0 0 218px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .status {
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
    font-weight: 600; background: var(--chip);
  }
  .status[data-tone="win"] { color: #1d6f4a; }
  .status[data-tone="lose"] { color: var(--danger); }
  html[data-theme="dark"] .status[data-tone="win"] { color: #6fcf9c; }
  .ops, .modes { display: flex; gap: 8px; }
  .modes button { flex: 1; font-size: 12.5px; padding: 6px 4px; }
  .modes button[data-on="1"] { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
  button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); padding: 7px 12px; cursor: pointer;
  }
  button:hover { background: var(--chip); }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  button.primary:hover { filter: brightness(1.06); }
  button[data-armed="1"] { border-color: var(--danger); color: var(--danger); font-weight: 600; }

  .record { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .record-head { display: flex; align-items: baseline; gap: 8px; }
  .record-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .record-head .tag { margin-left: auto; font-size: 11.5px; color: var(--fg2); background: var(--chip); border-radius: 5px; padding: 1px 7px; }
  .list { overflow-y: auto; max-height: 200px; }
  .rec { display: flex; align-items: baseline; gap: 7px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .rec .r { font-weight: 600; }
  .rec .r[data-r="win"] { color: #1d6f4a; }
  .rec .r[data-r="lose"] { color: var(--danger); }
  html[data-theme="dark"] .rec .r[data-r="win"] { color: #6fcf9c; }
  .rec .t { margin-left: auto; color: var(--dim); font-size: 11px; white-space: nowrap; }
  .empty { color: var(--dim); padding: 10px 0; font-size: 12.5px; }
  .dbnote { color: var(--danger); font-size: 11.5px; min-height: 0; }
  .dbnote:empty { display: none; }

  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(8px);
    background: var(--chip); color: var(--fg2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 14px; font-size: 12.5px;
    opacity: 0; transition: .18s; pointer-events: none;
  }
  #toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body data-state="playing" data-turn="human" data-mode="ai" data-moves="0" data-records="0" data-saved="">
<div class="wrap">
  <section class="board-side">
    <div class="head">
      <h1>五子棋</h1>
      <div class="sub" id="meta">正在连接宿主…</div>
    </div>
    <div class="board" id="board" data-role="board"></div>
  </section>

  <aside class="side">
    <div class="status" id="status" data-role="status" data-tone="info">轮到你落子（你先手，执黑）</div>
    <div class="modes">
      <button type="button" data-act="mode" data-mode="ai">人机对战</button>
      <button type="button" data-act="mode" data-mode="duo">两人对战</button>
    </div>
    <div class="ops">
      <button class="primary" type="button" data-act="restart" id="restart">重新开一局</button>
      <button type="button" data-act="undo" id="undo">悔棋</button>
    </div>

    <div class="record">
      <div class="record-head">
        <h2>战绩</h2>
        <span class="tag" id="stats">—</span>
      </div>
      <div class="list" id="records"></div>
      <div class="dbnote" id="dbnote"></div>
      <button type="button" data-act="clear-records" id="clear">清空战绩</button>
    </div>
  </aside>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  var TOOL_SOURCE = "workbench-tool";
  var HOST_SOURCE = "workbench-host";
  var SIZE = 15;
  var EMPTY = 0, BLACK = 1, WHITE = 2;
  var DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
  var RECENT = 5;                        /* 战绩列表只显示最近几条 */
  var AI_DELAY = 140;                    /* 让"电脑在想"有一个可见的瞬间 */

  var seq = 0, waiting = new Map(), ctx = null;
  var board = [];
  var cells = [];
  var history = [];                      /* 落子顺序，悔棋用 */
  var mode = "ai";                       /* "ai" 人机 | "duo" 两人 */
  var over = false, busy = false;
  var records = [];
  var clearArmed = false, clearTimer = null;

  /* ---------------- 与宿主通信（唯一通道） ---------------- */

  function call(op, payload) {
    var id = "r" + ++seq;
    return new Promise(function (resolve, reject) {
      waiting.set(id, { resolve: resolve, reject: reject });
      parent.postMessage({ source: TOOL_SOURCE, type: "tool:request", id: id, op: op, payload: payload || {} }, "*");
      setTimeout(function () {
        if (waiting.delete(id)) reject(new Error("宿主没有回应（" + op + "）"));
      }, 10000);
    }).then(function (res) {
      if (!res.ok) throw new Error(String(res.error || "宿主拒绝了这次请求"));
      return res.data;
    });
  }

  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.source !== HOST_SOURCE) return;

    if (m.type === "tool:response") {
      var w = waiting.get(m.id);
      if (w) { waiting.delete(m.id); w.resolve({ ok: m.ok, data: m.data, error: m.error }); }
      return;
    }
    if (m.type === "tool:context") {
      ctx = m.data;
      if (ctx) document.documentElement.dataset.theme = ctx.theme || "light";
      showMeta();
      return;
    }
    if (m.type === "tool:event") {
      /* 用户在「设置 → 数据库」里清了这个工具的命名空间：表被重建为空表，
         但界面上摆的还是旧战绩，得重新拉一次，否则清完还看得见。 */
      if (m.event === "schema:reset") {
        records = [];
        renderRecords();
        syncState();
        void loadRecords();
        toast("战绩已被清空");
      }
    }
  });

  /* ---------------- 小工具 ---------------- */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function timeText(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    var p = function (n) { return n < 10 ? "0" + n : n; };
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  var toastTimer = null;
  function toast(text) {
    var el = document.getElementById("toast");
    el.textContent = text;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("on"); }, 2600);
  }

  function showMeta() {
    var el = document.getElementById("meta");
    if (!ctx) { el.textContent = "还没收到宿主的运行上下文"; return; }
    el.textContent = "战绩存在 " + ctx.tablePrefix + "records · " +
      (ctx.driver === "sqlite" ? "SQLite" : "内存库") +
      " · schema v" + ctx.schemaVersion + " · " + (ctx.runtime === "desktop" ? "桌面版" : "浏览器");
  }

  function setStatus(text, tone) {
    var el = document.getElementById("status");
    el.textContent = text;
    el.dataset.tone = tone || "info";
  }

  /* ---------------- 棋盘 ---------------- */

  var at = function (x, y) { return board[y * SIZE + x]; };
  var inB = function (x, y) { return x >= 0 && y >= 0 && x < SIZE && y < SIZE; };

  /**
   * 棋盘状态的唯一初始化点。
   * 必须在建 DOM 之前跑：否则 at(x,y) 一直返回 undefined，
   * 而"这一格不是空的"判定会把每次点击都挡回去 —— 表现为点哪儿都没反应。
   */
  function initBoard() {
    board = [];
    for (var i = 0; i < SIZE * SIZE; i++) board.push(EMPTY);
  }

  function buildBoard() {
    initBoard();
    var el = document.getElementById("board");
    var html = "";
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        html += '<button type="button" class="cell" data-act="place" data-x="' + x + '" data-y="' + y +
          '" aria-label="第' + (x + 1) + '列第' + (y + 1) + '行"></button>';
      }
    }
    el.innerHTML = html;
    cells = [];
    var nodes = el.querySelectorAll(".cell");
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      var st = document.createElement("i");
      st.className = "st";
      node.appendChild(st);
      cells.push(node);
    }
  }

  function paint(x, y) {
    var c = cells[y * SIZE + x];
    var v = at(x, y);
    if (v === EMPTY) delete c.dataset.stone;
    else c.dataset.stone = v === BLACK ? "black" : "white";
  }

  /** 这一格轮到谁 —— ai 模式下人固定执黑；两人模式下黑白交替 */
  function turnValue() {
    if (over) return "-";
    if (busy) return "ai";
    if (mode === "duo") return history.length % 2 === 0 ? "black" : "white";
    return "human";
  }

  function syncState() {
    var b = document.body;
    b.dataset.mode = mode;
    b.dataset.moves = String(history.length);
    b.dataset.turn = turnValue();
    b.dataset.records = String(records.length);
    b.dataset.last = history.length ? (history[history.length - 1].x + "," + history[history.length - 1].y) : "";
    if (!over) b.dataset.state = "playing";
  }

  function idleText() {
    if (over) return document.getElementById("status").textContent;
    if (mode === "duo") return history.length % 2 === 0 ? "轮到黑方落子" : "轮到白方落子";
    return "轮到你落子（你先手，执黑）";
  }

  /* ---------------- 规则 ---------------- */

  /* 以 (x,y) 为中心、沿 (dx,dy) 数同色连子。调用方保证 (x,y) 已假设落着 color */
  function runInfo(x, y, dx, dy, color) {
    var n = 1, px = x + dx, py = y + dy;
    while (inB(px, py) && at(px, py) === color) { n++; px += dx; py += dy; }
    var open = inB(px, py) && at(px, py) === EMPTY ? 1 : 0;
    px = x - dx; py = y - dy;
    while (inB(px, py) && at(px, py) === color) { n++; px -= dx; py -= dy; }
    if (inB(px, py) && at(px, py) === EMPTY) open++;
    return { n: n, open: open };
  }

  function shapeScore(n, open) {
    if (n >= 5) return 10000000;
    if (n === 4) return open >= 2 ? 500000 : open === 1 ? 50000 : 0;
    if (n === 3) return open >= 2 ? 20000 : open === 1 ? 1500 : 0;
    if (n === 2) return open >= 2 ? 800 : open === 1 ? 100 : 0;
    if (n === 1) return open >= 2 ? 20 : open === 1 ? 5 : 0;
    return 0;
  }

  /* 在 (x,y) 落 color 这一子值多少分。四方向求和 —— 双活三之类的组合自然叠加 */
  function scoreAt(x, y, color) {
    var total = 0;
    for (var d = 0; d < 4; d++) {
      var info = runInfo(x, y, DIRS[d][0], DIRS[d][1], color);
      total += shapeScore(info.n, info.open);
    }
    return total;
  }

  function hasNeighbor(x, y, r) {
    for (var dy = -r; dy <= r; dy++) {
      for (var dx = -r; dx <= r; dx++) {
        if (!dx && !dy) continue;
        if (inB(x + dx, y + dy) && at(x + dx, y + dy) !== EMPTY) return true;
      }
    }
    return false;
  }

  /* 电脑一手。刻意**不用随机数**：同样的局面永远走同一步，
     这样自动化测试才敢断言"点这里之后它一定堵这里" */
  function chooseMove() {
    var best = null, bestScore = -1;
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        if (at(x, y) !== EMPTY) continue;
        if (!hasNeighbor(x, y, 2)) continue;
        var s = scoreAt(x, y, WHITE) * 1.1 + scoreAt(x, y, BLACK);
        var tie = Math.abs(x - 7) + Math.abs(y - 7);
        if (s > bestScore || (s === bestScore && best !== null && tie < best.tie)) {
          bestScore = s;
          best = { x: x, y: y, tie: tie };
        }
      }
    }
    if (best) return { x: best.x, y: best.y };
    if (at(7, 7) === EMPTY) return { x: 7, y: 7 };
    for (var i = 0; i < board.length; i++) {
      if (board[i] === EMPTY) return { x: i % SIZE, y: Math.floor(i / SIZE) };
    }
    return null;
  }

  /** 返回构成五连的那几个点；没有返回 null */
  function winningLine(x, y, color) {
    for (var d = 0; d < 4; d++) {
      var dx = DIRS[d][0], dy = DIRS[d][1];
      var line = [[x, y]];
      var i, nx, ny;
      for (i = 1; i < 5; i++) {
        nx = x + dx * i; ny = y + dy * i;
        if (!inB(nx, ny) || at(nx, ny) !== color) break;
        line.push([nx, ny]);
      }
      for (i = 1; i < 5; i++) {
        nx = x - dx * i; ny = y - dy * i;
        if (!inB(nx, ny) || at(nx, ny) !== color) break;
        line.unshift([nx, ny]);
      }
      if (line.length >= 5) {
        /* 只点亮包含落子点的那一段，别把六连的第六个也圈进去 */
        var start = 0;
        for (var k = 0; k < line.length; k++) {
          if (line[k][0] === x && line[k][1] === y) { start = k; break; }
        }
        start = Math.max(0, Math.min(start - 2, line.length - 5));
        return line.slice(start, start + 5);
      }
    }
    return null;
  }

  function markWin(line) {
    for (var i = 0; i < line.length; i++) {
      cells[line[i][1] * SIZE + line[i][0]].classList.add("win");
    }
  }

  /* ---------------- 一局的过程 ---------------- */

  function drop(x, y, color) {
    board[y * SIZE + x] = color;
    history.push({ x: x, y: y, color: color });
    paint(x, y);
    return checkEnd(x, y, color);
  }

  function checkEnd(x, y, color) {
    var line = winningLine(x, y, color);
    if (line) {
      markWin(line);
      endGame(color === BLACK ? "win" : "lose");
      return true;
    }
    if (history.length >= SIZE * SIZE) {
      endGame("draw");
      return true;
    }
    return false;
  }

  function endGame(result) {
    over = true;
    busy = false;
    document.body.dataset.state = result;
    syncState();
    /* 结果值域只有三个：win / lose / draw —— 与库里存的那一列、与 data-r
       属性、与 CSS 选择器必须是同一套。写成 won/lost 会全落进"和"那个分支，
       界面上看着"记上了"，其实每局都被算成平局（这个坑真踩过一次）。 */
    if (mode === "duo") {
      /* 两人模式下没有"电脑赢了"这回事，只有哪一方连成了 */
      if (result === "win") setStatus("黑方连成五子，黑胜", "win");
      else if (result === "lose") setStatus("白方连成五子，白胜", "win");
      else setStatus("平局，棋盘满了也没分出胜负", "info");
    } else if (result === "win") {
      setStatus("你赢了，五子连成一线", "win");
    } else if (result === "lose") {
      setStatus("电脑先连成五子，这局输了", "lose");
    } else {
      setStatus("平局，棋盘满了也没分出胜负", "info");
    }
    void saveRecord(result);
  }

  async function saveRecord(result) {
    try {
      await call("row.insert", {
        table: "records",
        row: {
          id: "g-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8),
          result: result,
          moves: history.length,
          created_at: new Date().toISOString(),
        },
      });
      document.body.dataset.saved = "1";
      document.getElementById("dbnote").textContent = "";
      await loadRecords();
      toast("这一局已记进战绩");
    } catch (err) {
      /* 写失败必须摆在界面上 —— 只在 console 里 log 的话，
         用户会以为战绩存上了，下次打开发现没有，只会觉得工具坏了 */
      document.body.dataset.saved = "0";
      document.getElementById("dbnote").textContent = "战绩没存上：" + err.message;
      toast("战绩没存上：" + err.message);
    }
  }

  function aiTurn() {
    if (over) return;
    busy = true;
    syncState();
    setStatus("电脑在想…", "info");
    setTimeout(function () {
      var mv = chooseMove();
      busy = false;
      if (!mv) { endGame("draw"); return; }
      if (drop(mv.x, mv.y, WHITE)) return;
      syncState();
      setStatus(idleText(), "info");
    }, AI_DELAY);
  }

  function tapCell(x, y) {
    if (over) { toast("这一局已经结束，开一局新的吧"); return; }
    if (busy) { toast("电脑还在想，稍等一下"); return; }
    if (at(x, y) !== EMPTY) return;
    var color = mode === "duo" ? (history.length % 2 === 0 ? BLACK : WHITE) : BLACK;
    if (drop(x, y, color)) return;
    syncState();
    if (mode === "ai") { aiTurn(); return; }
    setStatus(idleText(), "info");
  }

  function restart() {
    for (var i = 0; i < board.length; i++) {
      if (board[i] !== EMPTY) {
        board[i] = EMPTY;
        paint(i % SIZE, Math.floor(i / SIZE));
      }
    }
    var wins = document.querySelectorAll(".cell.win");
    for (var k = 0; k < wins.length; k++) wins[k].classList.remove("win");
    history = [];
    over = false;
    busy = false;
    document.body.dataset.state = "playing";
    syncState();
    setStatus(idleText(), "info");
  }

  function setMode(next) {
    if (next !== "ai" && next !== "duo") return;
    if (next === mode) return;
    mode = next;
    /* 换模式必须重开：半局人机对局接着变成两人对局，谁该落子都说不清 */
    restart();
    paintModes();
    toast(next === "ai" ? "已切到人机对战" : "已切到两人对战（同一台电脑上黑白轮流）");
  }

  function paintModes() {
    var bs = document.querySelectorAll('[data-act="mode"]');
    for (var i = 0; i < bs.length; i++) {
      if (bs[i].dataset.mode === mode) bs[i].dataset.on = "1";
      else delete bs[i].dataset.on;
    }
  }

  function undo() {
    if (over) { toast("这一局已经结束，开一局新的吧"); return; }
    if (busy) { toast("电脑还在想，稍等一下"); return; }
    if (!history.length) { toast("还没有落子"); return; }
    if (mode === "duo") {
      var one = history.pop();
      board[one.y * SIZE + one.x] = EMPTY;
      paint(one.x, one.y);
    } else {
      /* 人机模式退到"我上一次落子之前"：先退掉电脑那一手，再退掉自己的 */
      while (history.length) {
        var last = history.pop();
        board[last.y * SIZE + last.x] = EMPTY;
        paint(last.x, last.y);
        if (last.color === BLACK) break;
      }
    }
    document.body.dataset.state = "playing";
    syncState();
    setStatus(idleText(), "info");
  }

  /* ---------------- 战绩 ---------------- */

  function renderRecords() {
    var total = records.length;
    var win = 0, lose = 0, draw = 0;
    for (var i = 0; i < total; i++) {
      if (records[i].result === "win") win++;
      else if (records[i].result === "lose") lose++;
      else draw++;
    }
    document.getElementById("stats").textContent =
      total ? win + " 胜 · " + lose + " 负 · " + draw + " 和" : "还没有战绩";

    var el = document.getElementById("records");
    if (!total) { el.innerHTML = '<div class="empty">下完一局会自动记在这里。</div>'; return; }
    var name = { win: "胜", lose: "负", draw: "和" };
    el.innerHTML = records.slice(0, RECENT).map(function (r) {
      return '<div class="rec" data-rec="' + esc(r.id) + '">' +
        '<span class="r" data-r="' + esc(r.result) + '">' + (name[r.result] || esc(r.result)) + "</span>" +
        "<span>" + esc(r.moves) + " 手</span>" +
        '<span class="t">' + timeText(r.created_at) + "</span>" +
        "</div>";
    }).join("");
  }

  async function loadRecords() {
    try {
      var res = await call("row.select", {
        table: "records",
        orderBy: "created_at",
        orderDir: "desc",
        limit: 200,
      });
      records = res.rows || [];
      renderRecords();
      syncState();
      document.getElementById("dbnote").textContent = "";
    } catch (err) {
      records = [];
      renderRecords();
      syncState();
      document.getElementById("records").innerHTML =
        '<div class="empty">读不到战绩：' + esc(err.message) + "</div>";
    }
  }

  function armClear() {
    var btn = document.getElementById("clear");
    clearArmed = true;
    btn.dataset.armed = "1";
    btn.textContent = "再点一次就清空";
    clearTimeout(clearTimer);
    clearTimer = setTimeout(function () {
      if (!clearArmed) return;
      clearArmed = false;
      delete btn.dataset.armed;
      btn.textContent = "清空战绩";
    }, 4000);
  }

  /* 清空是不可逆的，所以要点两次 —— 用两段式按钮而不是 confirm()：
     原生弹框在 iframe 里会把整个宿主界面冻住 */
  async function clearRecords() {
    if (!clearArmed) { armClear(); return; }
    clearArmed = false;
    clearTimeout(clearTimer);
    var btn = document.getElementById("clear");
    delete btn.dataset.armed;
    btn.textContent = "清空战绩";

    try {
      var res = await call("row.select", { table: "records", limit: 500 });
      var rows = res.rows || [];
      for (var i = 0; i < rows.length; i++) {
        await call("row.delete", { table: "records", id: rows[i].id });
      }
      await loadRecords();
      toast(rows.length ? "已清空 " + rows.length + " 条战绩" : "本来就是空的");
    } catch (err) {
      document.getElementById("dbnote").textContent = "清不掉：" + err.message;
      toast("清不掉：" + err.message);
    }
  }

  /* ---------------- 事件 ---------------- */

  document.getElementById("board").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act='place']");
    if (!btn) return;
    tapCell(Number(btn.dataset.x), Number(btn.dataset.y));
  });

  document.querySelector(".modes").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act='mode']");
    if (!btn) return;
    setMode(btn.dataset.mode);
  });

  document.getElementById("restart").addEventListener("click", function () { restart(); });
  document.getElementById("undo").addEventListener("click", function () { undo(); });
  document.getElementById("clear").addEventListener("click", function () { void clearRecords(); });

  /* ---------------- 启动 ---------------- */

  (async function boot() {
    buildBoard();
    paintModes();
    syncState();
    try {
      var info = await call("schema.info", {});
      var names = (info.tables || []).map(function (t) { return t.fullName || t.name; });
      document.getElementById("meta").textContent = "表已就绪 · " + names.join("、");
    } catch (err) {
      document.getElementById("dbnote").textContent = "宿主没给出表结构：" + err.message;
    }
    /* tool:context 可能先于 boot 的第二行到达；它到了就用更完整的说明覆盖 */
    if (ctx) showMeta();
    await loadRecords();
  })();
})();
</script>
</body>
</html>
