[package]
name = "todo-workbench"
version = "0.3.3"
description = "待办工作台 - 可扩展的桌面工作台"
authors = ["sogapopo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "todo_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 与下面 [dependencies] 里那条 indexmap 同一个原因，也必须写在这里：
# resolver v2 下构建依赖图与正常依赖图的 feature 是**分开**求并的，
# 只补一边的话，tauri-build 那条链上的 schemars 仍然会踩到同一个坑。
indexmap = { version = "1.9", default-features = false, features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 事务要真原子，就得自己占住一条连接（原因见 src/db_tx.rs 顶部）。
# 版本与 feature **刻意与 tauri-plugin-sql 对齐**：它启的是 "sqlx/sqlite" +
# "sqlx/runtime-tokio"，且没有关掉默认 feature。这样求并集后 feature 集合
# 与之前完全一致，不会因为 feature 不同而整条重编。
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

# 附件仓库要的几样东西。**全部是刻意与 tauri-plugin-updater 对齐的写法**，
# 因为 updater 已经把这些 crate 拉进依赖树并编译过了：
#   reqwest / rustls(features= ["ring"]) / infer / percent-encoding —— 都是它带的。
# 对齐 feature 就能复用已编译的产物，而不是因为 feature 不一致而整条重编
# （rustls 换个 provider 意味着连带编译 aws-lc-rs，那是个需要 cmake/nasm 的大家伙）。
# ring 与 reqwest 额外显式声明，是为了能直接用它们的 API（哈希、装 TLS provider）。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ring = "0.17"
infer = "0.19"
percent-encoding = "2"

# WPS 在线表格联动（src/wps.rs）要的两样。**都不是新进依赖树的 crate** ——
# zip 早被 tauri-plugin-updater 拉着编译过，regex 也被 tauri 工具链编译过，
# 版本与 Cargo.lock 里那两个完全一致，加这两行不会触发整树重编：
#   · zip 只开 `deflate-flate2`（纯 Rust 后端）。**不要开默认的 `deflate`** ——
#     那是 deflate-zopfli + deflate-flate2-zlib-rs，两个都要 C 工具链；
#     也不要开 `deflate-flate2-zlib`，那会把 flate2 切到 zlib-rs。
#   · regex 用默认 feature（unicode/std），与树里那份对齐。
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
regex = "1"
# ⚠️ 这一行是**被 zip 逼出来的**，看着多余，删了编译不过：
# zip 声明 flate2 时写的是 `default-features = false`，也就是"只要这个 crate，
# 一个 feature 都不给"。而依赖树里另一个用 flate2 的是 png（tauri-codegen →
# ico → png），它在**构建依赖**那一侧。resolver v2 下构建依赖与正常依赖的
# feature 不互通，于是正常依赖这边的 flate2 一个后端都没开，直接
# compile_error "You need to choose a zlib backend"。
# 在这里显式打开 rust_backend（miniz_oxide + crc32fast，纯 Rust，两个都
# 已在树里编译过）补上。别改成 zlib / zlib-rs —— 那两条要 C 工具链。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# ⚠️ 这一行**不是我们用的**，是给 schemars 0.8.22 打的补丁，删了会编译不过。
#
# 链路：tauri-utils / tauri-plugin / tauri-build → schemars 0.8.22（开着
# `preserve_order`）→ indexmap 1.9。而 schemars 声明 indexmap 时没要 `std`，
# indexmap 1.9 自己的 `default` 也不含 `std`，于是它的 build.rs 退化成
# "探测一下目标里有没有 std"（autocfg 的 emit_sysroot_crate）。
#
# 那个探测在 rustc 1.98 之后会失败（构建脚本的 stderr 里留一句
# `warning: autocfg could not probe for \`std\``），于是 has_std 没发出，
# indexmap 落到 `#[cfg(not(has_std))] pub struct IndexMap<K, V, S>` ——
# 第三个泛型参数没有默认值，schemars 的 `Map<K, V> = IndexMap<K, V>` 就报错了：
#   error[E0107]: struct takes 3 generic arguments but 2 generic arguments were supplied
#
# 直接在依赖树里把 `std` 打开 = 让它走 CARGO_FEATURE_STD 那条分支，
# 一次探测都不做。等上游把 indexmap 换掉，这一行就可以删。
indexmap = { version = "1.9", default-features = false, features = ["std"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# 唤起客户端（自定义协议）只有 Windows 有实现，且只用到一个 Win32 API。
# 用 windows-sys 而不是 windows：前者是纯 FFI 声明，不加 Result 包装、
# 不引入额外的类型层，编译代价几乎为零（0.59 本来就在依赖树里）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
