    document.removeEventListener("pointerup", onPanEnd);
    if (p.moved) state.lastPanAt = Date.now();
  }

  /* ---------------- 浮层：颜色 / 提醒 ---------------- */

  function closePops() {
    var all = board.querySelectorAll(".pop");
    for (var i = 0; i < all.length; i++) all[i].remove();
  }

  function toggleColorPop(root, n) {
    var had = root.querySelector(".pop.sw");
    closePops();
    if (had) return;
    bringToFront(n, root);   // 浮层挂在便签里，便签不抬到最上面就会被别的便签压住
    var p = document.createElement("div");
    p.className = "pop sw";
    var row = document.createElement("div");
    row.className = "swatches";
    COLORS.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.color = c.id;
      b.title = c.id;
      b.style.background = c.bg;
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        n.color = c.id;
        applyColor(root, c.id);
        p.remove();
        saveNew(n, { color: c.id });
      });
      row.appendChild(b);
    });

    /* 自定义颜色：最后一个是取色器（原生 input[type=color]，WebView2 里是系统色板）。
       取完之后直接落库成 #rrggbb —— colorOf 认得这种值。 */
    var custom = document.createElement("label");
    custom.className = "cus";
    custom.title = "自己调一个颜色";
    var picker = document.createElement("input");
    picker.type = "color";
    picker.value = /^#[0-9a-f]{6}$/i.test(String(n.color || "")) ? n.color : "#fdf3c8";
    picker.addEventListener("input", function () {
      n.color = picker.value;
      applyColor(root, picker.value);
    });
    picker.addEventListener("change", function () {
      saveNew(n, { color: n.color });
      p.remove();
    });
    custom.appendChild(picker);
    row.appendChild(custom);

    p.appendChild(row);
    root.appendChild(p);
  }

  /**
   * 提醒面板：自绘的日历 + 时刻。
   *
   * 为什么不用 <input type="datetime-local">：它的样子完全由 WebView2 决定
   * （灰扑扑一个系统控件），而且要点开两级系统弹层；这里要的是"点两下就定好"。
   * 结构：月份头 → 7×6 的日格（周一开头）→ 时刻 + 今天/明天 → 取消/设提醒。
   */
  function toggleRemindPop(root, n) {
    var had = root.querySelector(".pop.rm");
    closePops();
    if (had) return;
    bringToFront(n, root);   // 浮层挂在便签里，便签不抬到最上面会被别的便签压住

    var seed = n.remind_at ? new Date(n.remind_at) : defaultRemind();
    if (isNaN(seed.getTime())) seed = defaultRemind();
    state.pickDate = dateStr(seed);
    state.pickTime = pad(seed.getHours()) + ":" + pad(seed.getMinutes());
    state.pickMonth = new Date(seed.getFullYear(), seed.getMonth(), 1);

    var p = document.createElement("div");
    p.className = "pop rm";

    var cal = document.createElement("div");
    cal.className = "cal";
    p.appendChild(cal);
    drawCal(cal, p);

    var row2 = document.createElement("div");
    row2.className = "calrow";
    var tm = document.createElement("input");
    tm.type = "time";
    tm.className = "tm";
    tm.value = state.pickTime;
    tm.addEventListener("change", function () {
      state.pickTime = tm.value || "09:00";
      tm.value = state.pickTime;
    });
    var bToday = document.createElement("button");
    bToday.type = "button";
    bToday.textContent = "今天";
    bToday.addEventListener("click", function () {
      state.pickDate = dateStr(new Date());
      state.pickMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      drawCal(cal, p);
    });
    var bTomorrow = document.createElement("button");
    bTomorrow.type = "button";
    bTomorrow.textContent = "明天";
    bTomorrow.addEventListener("click", function () {
      var d = new Date();
      d.setDate(d.getDate() + 1);
      state.pickDate = dateStr(d);
      state.pickMonth = new Date(d.getFullYear(), d.getMonth(), 1);
      drawCal(cal, p);
    });
    row2.appendChild(tm);
    row2.appendChild(bToday);
    row2.appendChild(bTomorrow);
    p.appendChild(row2);

    var row = document.createElement("div");
    row.className = "row";
    if (n.remind_at) {
      var cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "danger";
      cancel.textContent = "取消提醒";
      cancel.addEventListener("click", function () { void cancelReminder(n, root, p); });
      row.appendChild(cancel);
    }
    var ok = document.createElement("button");
    ok.type = "button";
    ok.className = "primary";
    ok.textContent = n.remind_at ? "改时间" : "设提醒";
    ok.addEventListener("click", function () {
      var d = new Date(state.pickDate + "T" + state.pickTime + ":00");
      if (isNaN(d.getTime())) { toast("先选一个日期和时刻"); return; }
      void setReminder(n, root, d, p);
    });
    row.appendChild(ok);
    p.appendChild(row);
    root.appendChild(p);
  }

  /** 画一份月历（点箭头换月、点日子选日期，都就地重画这一块） */
  function drawCal(cal, pop) {
    cal.textContent = "";
    var y = state.pickMonth.getFullYear();
    var m = state.pickMonth.getMonth();

    var head = document.createElement("div");
    head.className = "calhead";
    var prev = document.createElement("button");
    prev.type = "button";
    prev.textContent = "\u2039";
    prev.title = "上个月";
    prev.addEventListener("click", function () {
      state.pickMonth = new Date(y, m - 1, 1);
      drawCal(cal, pop);
    });
    var title = document.createElement("span");
    title.textContent = y + " 年 " + (m + 1) + " 月";
    var next = document.createElement("button");
    next.type = "button";
    next.textContent = "\u203a";
    next.title = "下个月";
    next.addEventListener("click", function () {
      state.pickMonth = new Date(y, m + 1, 1);
      drawCal(cal, pop);
    });
    head.appendChild(prev);
    head.appendChild(title);
    head.appendChild(next);

    var grid = document.createElement("div");
    grid.className = "calgrid";
    ["一", "二", "三", "四", "五", "六", "日"].forEach(function (d) {
      var s = document.createElement("span");
      s.className = "dow";
      s.textContent = d;
      grid.appendChild(s);
    });

    var firstDow = (new Date(y, m, 1).getDay() + 6) % 7;   // 周一 = 0
    var days = new Date(y, m + 1, 0).getDate();
    var todayS = dateStr(new Date());
    for (var i = 0; i < firstDow; i++) grid.appendChild(document.createElement("span"));
    for (var d = 1; d <= days; d++) {
      (function (day) {
        var ds = y + "-" + pad(m + 1) + "-" + pad(day);
        var b = document.createElement("button");
        b.type = "button";
        b.className = "day" + (ds === state.pickDate ? " sel" : "") + (ds === todayS ? " today" : "");
        b.dataset.date = ds;
        b.textContent = String(day);
        b.addEventListener("click", function () {
          state.pickDate = ds;
          drawCal(cal, pop);
        });
        grid.appendChild(b);
      })(d);
    }

    cal.appendChild(head);
    cal.appendChild(grid);
  }

  /** 本地日期 YYYY-MM-DD（不用 toISOString，会被时区推到前一天） */
  function dateStr(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function toLocalInput(d) {
    if (!(d instanceof Date) || isNaN(d.getTime())) return "";
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function defaultRemind() {
    var d = new Date(Date.now() + 60 * 60000);
    d.setSeconds(0, 0);
    return d;
  }

  async function setReminder(n, root, when, pop) {
    var title = (n.title || firstLine(n.body) || "便签提醒").slice(0, 190);
    try {
      // 已经有提醒：先撤掉旧的，避免同一张便签挂两条待办
      if (n.remind_task) {
        try { await call("task.remind", { action: "cancel", taskId: n.remind_task }); } catch (err) {}
      }
      var res = await call("task.remind", {
        title: title,
        dueAt: when.toISOString(),
        note: String(n.body || "").slice(0, 500),
        ref: String(n.id)
      });
      n.remind_at = String(res.remindAt || when.toISOString());
      n.remind_task = String(res.taskId || "");
      saveNew(n, { remind_at: n.remind_at, remind_task: n.remind_task });
      renderRemind(root, n);
      syncBell(root, n);
      if (pop) pop.remove();
      toast("提醒已放进待办（" + (res.listName || "清单") + "），有提醒的那天会出现在「今天」");
    } catch (err) {
      toast("设提醒失败：" + friendly(err));
    }
  }

  async function cancelReminder(n, root, pop) {
    var taskId = n.remind_task;
    n.remind_at = "";
    n.remind_task = "";
    if (taskId) {
      try { await call("task.remind", { action: "cancel", taskId: taskId }); } catch (err) {}
    }
    saveNew(n, { remind_at: "", remind_task: "" });
    renderRemind(root, n);
    syncBell(root, n);
    if (pop) pop.remove();
    toast("提醒取消了");
  }

  /* ---------------- 图片（图床） ---------------- */

  async function attachImage(n, root, file) {
    if (!file || !/^image\//.test(file.type || "")) { toast("只支持图片文件"); return; }
    toast("正在存进图床…", null, null, 1400);
    try {
      var dataUrl = await readAsDataURL(file);
      var thumb = await makeThumb(dataUrl, 320);
      var item = await call("gallery.put", {
        dataUrl: dataUrl,
        title: (n.title || firstLine(n.body) || "便签图片").slice(0, 80),
        note: "来自便签"
      });
      n.gallery_id = item.id;
      n.thumb = thumb || item.thumb || "";
      saveNew(n, { gallery_id: n.gallery_id, thumb: n.thumb });
      renderImage(root, n);
      toast("图片已存进图床");
    } catch (err) {
      toast("图片没存进去：" + friendly(err));
    }
  }

  async function detachImage(n, root) {
    n.gallery_id = "";
    n.thumb = "";
    saveNew(n, { gallery_id: "", thumb: "" });
    renderImage(root, n);
    toast("已从便签移除（图床里的原图还在）");
  }

  /** 读图片原始尺寸；读不到（或无头环境没有解码）就退回默认尺寸 */
  function imageSize(file) {
    return new Promise(function (resolve) {
      var done = false;
      var finish = function (v) {
        if (done) return;
        done = true;
        resolve(v || {});
      };
      setTimeout(function () { finish({}); }, 400);
      try {
        var url = URL.createObjectURL(file);
        var im = new Image();
        im.onload = function () {
          var r = { w: im.naturalWidth || 0, h: im.naturalHeight || 0 };
          try { URL.revokeObjectURL(url); } catch (e) {}
          finish(r);
        };
        im.onerror = function () {
          try { URL.revokeObjectURL(url); } catch (e) {}
          finish({});
        };
        im.src = url;
      } catch (e) { finish({}); }
    });
  }

  /** 图片便签：整张图就是一张便签，宽高按原图比例 */
  async function addImageNote(file, at) {
    if (!file || !/^image\//.test(file.type || "")) { toast("只支持图片文件"); return; }
    var size = await imageSize(file);
    var w = 260;
    var h = size.w && size.h ? Math.round(w * (size.h / size.w)) : 190;
    h = Math.max(110, Math.min(430, h));
    var n = await addNote(at ? { x: at.x - w / 2, y: at.y - h / 2 } : null, "", { kind: "image", w: w, h: h });
    if (!n) return;
    var root = noteEl(n.id);
    if (root) await attachImage(n, root, file);
  }

  /** 新建菜单：fixed 定位 + 按触发按钮算坐标并钳进视口（别用 absolute right:0） */
  function openNewMenu(anchor) {
    var m = document.getElementById("newmenu");
    m.hidden = false;
    var r = anchor.getBoundingClientRect();
    var w = m.offsetWidth || 186;
    var h = m.offsetHeight || 168;
    var left = Math.min(window.innerWidth - w - 8, Math.max(8, r.right - w));
    var top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    m.style.left = Math.round(left) + "px";
    m.style.top = Math.round(top) + "px";
  }

  /** 菜单里选的那一格 → 真的建一张 */
  async function createByKind(kind) {
    if (kind === "image") { fileInput.click(); return; }
    if (kind === "todo") { await addNote(null, "", { kind: "todo", items: "[]" }); return; }
    if (kind === "link") {
      var raw = await askInput("添加链接", "粘贴一个网址，便签上点一下就能打开", "");
      if (raw === null) return;
      var url = normalizeUrl(raw);
      if (!url) { toast("这个地址看起来不对"); return; }
      await addNote(null, url, { kind: "link", title: hostOf(url) });
      return;
    }
    await addNote();
  }

  async function openLightbox(n) {
    if (!n.gallery_id) return;
    var box = document.getElementById("lightbox");
    var lb = document.getElementById("lbImg");
    var hit = state.imgCache[n.gallery_id];
    if (hit) { lb.src = hit; box.hidden = false; return; }
    try {
      var it = await call("gallery.get", { id: n.gallery_id });
      if (!it || !it.dataUrl) throw new Error("图床里没有这张图");
      state.imgCache[n.gallery_id] = it.dataUrl;
      lb.src = it.dataUrl;
      box.hidden = false;
    } catch (err) { toast("取原图失败：" + err.message); }
  }

  function boardPoint(clientX, clientY) {
    // getBoundingClientRect 拿到的是缩放后的矩形，除以 scale 才是白板坐标
    var r = board.getBoundingClientRect();
    var s = state.scale || 1;
    return { x: Math.max(0, (clientX - r.left) / s), y: Math.max(0, (clientY - r.top) / s) };
  }

  /* ---------------- 启动 ---------------- */

  /* 1.2 秒没等到宿主上下文 = 当作独立运行（浏览器里直接打开这个 html 的情形）。
     只是给测试与样式一个可判定的状态，不影响任何功能分支。 */
  setTimeout(function () {
    if (!ctx) document.body.dataset.bindState = "standalone";
  }, 1200);

  (async function boot() {
    stage = document.getElementById("stage");
    scroll = document.getElementById("scroll");
    canvas = document.getElementById("canvas");
    board = document.getElementById("board");
    empty = document.getElementById("empty");
    toastEl = document.getElementById("toast");
    fileInput = document.getElementById("file");

    document.getElementById("add").addEventListener("click", function () { void addNote(); });
    document.getElementById("addBoard").addEventListener("click", function () { void addBoard(); });

    /* 新建菜单：文字 / 图片 / 待办表 / 链接 */
    var newMenu = document.getElementById("newmenu");
    document.getElementById("addMore").addEventListener("click", function (e) {
      e.stopPropagation();
      if (!newMenu.hidden) { newMenu.hidden = true; return; }
      openNewMenu(this);
    });
    newMenu.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button[data-kind]") : null;
      if (!b) return;
      newMenu.hidden = true;
      void createByKind(b.dataset.kind);
    });
    document.addEventListener("pointerdown", function (e) {
      if (newMenu.hidden) return;
      if (e.target && e.target.closest && (e.target.closest("#newmenu") || e.target.closest("#addMore"))) return;
      newMenu.hidden = true;
    }, true);
    document.getElementById("askInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); closeAsk(true); }
    });

    /* 标签多的时候：滚轮直接横滚（比去拖那条看不见的滚动条顺手） */
    document.getElementById("tabs").addEventListener("wheel", function (e) {
      var el = this;
      if (el.scrollWidth <= el.clientWidth + 1) return;
      if (!e.deltaY) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }, { passive: false });
    window.addEventListener("resize", syncTabsFade);

    /* 自绘确认框的三个出口 */
    document.getElementById("askNo").addEventListener("click", function () { closeAsk(false); });
    document.getElementById("askYes").addEventListener("click", function () { closeAsk(true); });
    document.getElementById("ask").addEventListener("click", function (e) {
      if (e.target === this) closeAsk(false);
    });

    /* 缩放：滚轮（含 Ctrl+滚轮）以光标为锚点；Shift+滚轮横向平移 */
    scroll.addEventListener("wheel", function (e) {
      if (e.shiftKey) {
        e.preventDefault();
        scroll.scrollLeft += e.deltaY;
        return;
      }
      e.preventDefault();
      var factor = Math.exp(-(e.deltaY || 0) * 0.0015);
      setZoom(state.scale * factor, e.clientX, e.clientY);
    }, { passive: false });
    document.getElementById("zoomIn").addEventListener("click", function () { setZoom(state.scale * 1.2); });
    document.getElementById("zoomOut").addEventListener("click", function () { setZoom(state.scale / 1.2); });
    document.getElementById("zoomPct").addEventListener("click", function () { setZoom(1); });

    fileInput.addEventListener("change", function () {
      var files = [];
      for (var i = 0; i < fileInput.files.length; i++) files.push(fileInput.files[i]);
      fileInput.value = "";              // 先抓走再清：Chromium 里清 value 会就地清空 FileList
      files.forEach(function (f) { void addImageNote(f); });
    });

    /* 平移：空白处按住拖 */
    board.addEventListener("pointerdown", onBoardDown);

    /* 双击空白处新建（刚平移过就不算，免得松手就多一张） */
    board.addEventListener("dblclick", function (e) {
      if (e.target !== board) return;
      if (Date.now() - state.lastPanAt < 350) return;
      var p = boardPoint(e.clientX, e.clientY);
      void addNote({ x: p.x - DEF_W / 2 + 40, y: p.y - 20 });
    });

    /* 粘贴图片：便签里粘 = 挂到这张；空白处粘 = 新建一张图片便签 */
    document.addEventListener("paste", function (e) {
      var dt = e.clipboardData;
      if (!dt || !dt.items) return;
      var file = null;
      for (var i = 0; i < dt.items.length; i++) {
        var it = dt.items[i];
        if (it.kind === "file" && /^image\//.test(it.type)) { file = it.getAsFile(); break; }
      }
      if (!file) return;
      e.preventDefault();
      var host = e.target && e.target.closest ? e.target.closest(".note") : null;
      var n = host ? byId(host.dataset.id) : null;
      if (n && host) { void attachImage(n, host, file); return; }
      void addImageNote(file);
    });

    /* 拖文件进来：落在便签上=挂上去，落在空白处=新便签 */
    document.addEventListener("dragover", function (e) { e.preventDefault(); });
    document.addEventListener("drop", function (e) {
      var dt = e.dataTransfer;
      if (!dt || !dt.files || !dt.files.length) return;
      e.preventDefault();
      var host = e.target && e.target.closest ? e.target.closest(".note") : null;
      var n = host ? byId(host.dataset.id) : null;
      var p = boardPoint(e.clientX, e.clientY);
      for (var i = 0; i < dt.files.length; i++) {
        var f = dt.files[i];
        if (!/^image\//.test(f.type || "")) continue;
        if (n && host) { void attachImage(n, host, f); break; }
        void addImageNote(f, { x: p.x, y: p.y });
      }
    });

    document.addEventListener("pointerdown", function (e) {
      if (!e.target || !e.target.closest) return;
      if (e.target.closest(".dot") || e.target.closest(".pop") || e.target.closest(".iconbtn")) return;
      closePops();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      var askBox = document.getElementById("ask");
      if (askBox && !askBox.hidden) { closeAsk(false); return; }
      if (state.linkFrom) { cancelLink(); return; }
      var menu = document.getElementById("newmenu");
      if (menu && !menu.hidden) { menu.hidden = true; return; }
      closePops();
      var lb = document.getElementById("lightbox");
      if (!lb.hidden) lb.hidden = true;
    });
    document.getElementById("lbClose").addEventListener("click", function () {
      document.getElementById("lightbox").hidden = true;
    });
    document.getElementById("lightbox").addEventListener("click", function (e) {
      if (e.target === this) this.hidden = true;
    });
    window.addEventListener("resize", function () { growBoard(); });

    await probePos();
    await load();
    if (state.posOk === false) toast("宿主版本较旧：位置、尺寸、图片、提醒只在本页有效");

    booted = true;
    if (pendingFocus) {
      var fid = pendingFocus;
      pendingFocus = "";
      void focusNoteById(fid);
    }
    if (pendingIntent !== null) {
      var text = pendingIntent;
      pendingIntent = null;
      void addNote(null, text);
    }
    growBoard();
  })();
})();
</script>
</body>
</html>
